name: Publicar site

# Publica a versão web (pasta web/) na branch gh-pages, servida pelo GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-site
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Testes
        run: npm test

      - name: Publicar web/ em gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: Publicar site

name: Gerar aplicativo

# Gera o aplicativo portátil para Windows a cada envio para a branch main.
# Se a versão do package.json ainda não tiver sido publicada, cria a Release
# "v<versão>" com o ZIP anexado. Para lançar uma versão nova, basta aumentar
# "version" no package.json e enviar para a main.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-aplicativo
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testes do motor de busca
        run: npm test

      - name: Empacotar (Windows x64, portátil)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: BuscaMC-win-x64
          path: dist/*.zip
          if-no-files-found: error

      - name: Verificar se a versão já foi publicada
        id: versao
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "A versão $v já existe em Releases; nada a publicar."
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar em Releases
        if: steps.versao.outputs.publicar == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Busca de MC ${{ steps.versao.outputs.tag }}
          files: dist/*.zip
          fail_on_unmatched_files: true
          body: |
            **Como usar:** baixe `BuscaMC-...-win-x64.zip`, extraia a pasta e abra `BuscaMC.exe`.
            Não precisa instalar nem de administrador.

            Na primeira abertura, preencha `dados\config.json` (veja o README) ou copie a pasta `dados` de uma instalação anterior.
